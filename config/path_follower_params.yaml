path_follower_node:
  ros__parameters:
    # 周期・フレーム設定 (50Hz LiDARに同期推奨)
    control_rate: 50.0
    map_frame: "map"
    base_frame: "base_link"
    bucket_frame: "bucket_bottom"
    max_pose_age: 0.2
    max_bucket_age: 0.5
    control_comm_delay: 0.025
    max_delay_compensation: 0.15

    # 機体物理制限 (前処理プロファイルおよび1次加速度リミッタで使用)
    max_speed: 3.0
    max_acceleration: 6.0
    max_deceleration: 6.0
    max_jerk: 100.0
    max_lateral_acceleration: 3.0
    max_angular_velocity: 3.0
    max_angular_acceleration: 5.0
    turn_yaw_rate_ratio: 0.75
    min_turn_speed: 0.3
    path_interpolation_step: 0.02
    curvature_window: 0.50
    decel_effective_ratio: 0.7

    # 軌道追従・位置フィードバック制御
    position_kp: 20.0
    position_ki: 0.0
    max_fb_speed: 0.60
    min_docking_speed: 0.02
    settle_zone_distance: 0.50

    # 姿勢 (Yaw) 制御
    heading_kp: 3.0
    heading_ki: 0.2
    heading_kd: 0.1
    heading_integral_max: 0.3
    heading_d_filter_alpha: 0.4
    min_docking_yaw_rate: 0.03

    # ゴール判定・安全停止閾値
    goal_tolerance: 0.005        # 5 mm
    goal_yaw_tolerance: 0.0175   # 1.0 deg (rad)
    goal_settle_count: 5         # 連続5周期維持で完了
    max_path_error: 0.30
    max_initial_path_error: 0.45
