path_follower_node:
  ros__parameters:
    base_frame: base_link
    bucket_frame: bucket_bottom
    control_comm_delay: 0.02
    control_rate: 50.0
    curvature_window: 0.3
    decel_effective_ratio: 0.7
    goal_settle_count: 5
    goal_tolerance: 0.01
    goal_yaw_tolerance: 0.0175
    heading_d_filter_alpha: 0.0
    heading_integral_max: 0.3
    heading_kd: 0.0
    heading_ki: 0.0
    heading_kp: 3.5
    tracking_kp: 3.5
    tracking_ki: 0.0
    tracking_kd: 0.0
    tracking_integral_max: 0.2
    tracking_d_filter_alpha: 0.2
    tracking_deadband: 0.015
    tracking_pos_filter_alpha: 0.25
    max_tracking_angular_velocity: 2.0
    max_tracking_angular_acceleration: 12.0
    tracking_timeout: 1.0
    map_frame: map
    max_acceleration: 5.4
    max_angular_acceleration: 16.0
    max_angular_velocity: 3.0
    max_bucket_age: 0.5
    max_cruise_fb_speed: 3.0
    max_deceleration: 8.0
    max_delay_compensation: 0.15
    max_fb_speed: 0.7
    max_initial_path_error: 0.45
    max_jerk: 60.0
    max_lateral_acceleration: 4.0
    max_path_error: 0.3
    max_pose_age: 0.5
    max_speed: 3.0
    min_docking_speed: 0.2
    min_docking_yaw_rate: 0.03
    min_turn_speed: 0.3
    path_interpolation_step: 0.02
    position_d_filter_alpha: 0.4
    position_kd: 0.0
    position_ki: 0.0
    position_kp: 6.0
    qos_overrides./parameter_events.publisher.depth: 1000
    qos_overrides./parameter_events.publisher.durability: volatile
    qos_overrides./parameter_events.publisher.history: keep_last
    qos_overrides./parameter_events.publisher.reliability: reliable
    settle_zone_distance: 0.5
    turn_yaw_rate_ratio: 0.75
    use_sim_time: false