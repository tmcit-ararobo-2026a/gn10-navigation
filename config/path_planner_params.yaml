path_planner_node:
  ros__parameters:
    map_configs:
      map_frame: "map"
      base_frame: "base_link"
    a_star:
      planning_cost: 0.8
      # 障害物・インフレーション内にスタート/ゴールがある場合の最近傍通行可能セル探索半径 [m]
      snap_distance: 0.4
    bspline:
      # B-spline の隣接制御点間を分割して生成するサンプル数
      samples_per_segment: 10
      # 1反復あたりの内部制御点を隣接点の中点へ寄せる割合 (0.0〜1.0)
      smoothing_strength: 0.5
      # 内部制御点の反復ラプラシアン平滑化回数 (0〜50: 増やすほど階段ノイズが消え滑らかになる)
      smoothing_iterations: 20
      # 動的適応平滑化で試行する制御点間引きステップの最大値 (1〜50)
      max_stride: 24
      # 平滑化経路が通過を許容する最大セルコスト (0〜99: 低コスト安全領域内で平滑化を維持)
      smooth_max_cost: 20
    line_approximation:
      # 直線近似を許容する最大セルコスト (-1: 無効, 0〜99: このコスト以下の領域のみ直線化)
      max_cost: -1
      # 直線化する最小セグメント距離 [m]
      min_distance: 1.2
    footprint:
      # config/robot_shape_dimensioned.svg の青い8頂点外形。単位 m、反時計回り。
      # 原点: 元形状の幾何中心 (SVG: 819.90, 850.332381 mm)。+x 前方、+y 左。
      # 全長 0.98478 m、全幅 1.11981 m。C++既定値も robot_geometry.hpp に定義。
      polygon: [
        0.525332381, 0.209900000,
        -0.080887619, 0.559900000,
        -0.394447619, 0.350000000,
        -0.394447619, -0.350000000,
        -0.080887619, -0.559910000,
        0.525332381, -0.209910000,
        0.590332381, -0.080000000,
        0.590332381, 0.080000000
      ]
    rotation_planning:
      # 旋回区間全域で許容する最大フットプリントコスト (0~99: 通行可能, 100: 障害物)
      turn_max_cost: 20
      # 旋回干渉判定の角度ステップ [rad] (約5.7度)
      angle_step: 0.15
      # 旋回区間の移動距離 [m]
      turn_distance: 0.6
