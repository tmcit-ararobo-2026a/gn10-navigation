path_planner_node:
  ros__parameters:
    map_configs:
      map_frame: "map"
      base_frame: "base_link"
    a_star:
      planning_cost: 0.5
      # 障害物・インフレーション内にスタート/ゴールがある場合の最近傍通行可能セル探索半径 [m]
      snap_distance: 0.4
    elastic_band:
      # 反復緩和回数 (多いほど滑らかに収束, 10〜100, 既定値: 30)
      iterations: 30
      # 内部張力ゲイン (直線化・曲率最小化の強さ, 0.0〜1.0, 既定値: 1.0)
      elastic_strength: 1.0
      # コスト反発ゲイン (障害物・ポテンシャル勾配から押し離す強さ, 既定値: 0.05)
      repulsive_strength: 0.05
      # 反発力が働き始めるコスト閾値 (このコスト以下では直線化を優先, 0〜99, 既定値: 40)
      repulsive_cost_threshold: 40
      # 平滑化経路が通過を許容する最大セルコスト (0〜99: このコスト以下で平滑化を維持, 既定値: 60)
      max_cost: 60
      # 出力経路サンプリング解像度 [m] (既定値: 0.05)
      path_resolution: 0.05
    fillet:
      # RDP法で大域的コーナー頂点を抽出する許容誤差 [m] (既定値: 0.15)
      rdp_epsilon: 0.15
      # 目標旋回半径 [m] (2.4 m/s で横G 4.5 m/s^2 以内を維持するための大弧: R >= 1.28 m, 既定値: 2.0)
      target_radius: 2.0
      # 狭所・障害物近傍での最小許容旋回半径 [m] (障害物が接近している場合に縮小を許容する限界, 既定値: 0.2)
      min_radius: 0.2
      # コーナー円弧が許容する最大セルコスト (0〜99: このコスト以下を通過するよう半径を自動調停, 既定値: 60)
      max_cost: 60
      # 出力経路サンプリング解像度 [m] (既定値: 0.05)
      path_resolution: 0.05
      # 直線と円弧の接続部を滑らかにブレンドするイージング反復回数 (0: 無効, 1〜10, 既定値: 3)
      curvature_blend_iterations: 3
    footprint:
      # config/robot_shape_dimensioned.svg の青い8頂点外形。単位 m、反時計回り。
      # 原点: 元形状の幾何中心 (SVG: 819.90, 850.332381 mm)。+x 前方、+y 左。
      # 全長 0.98478 m、全幅 1.11981 m。C++既定値も robot_geometry.hpp に定義。
      polygon: [
        0.525332381, 0.209900000,
        -0.080887619, 0.559900000,
        -0.394447619, 0.350000000,
        -0.394447619, -0.350000000,
        -0.080887619, -0.559910000,
        0.525332381, -0.209910000,
        0.590332381, -0.080000000,
        0.590332381, 0.080000000
      ]
    rotation_planning:
      # 旋回区間全域で許容する最大フットプリントコスト (0~99: 通行可能, 100: 障害物)
      turn_max_cost: 20
      # 旋回干渉判定の角度ステップ [rad] (約5.7度)
      angle_step: 0.15
      # 旋回区間の移動距離 [m]
      turn_distance: 0.6
