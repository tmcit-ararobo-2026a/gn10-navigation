path_planner_node:
  ros__parameters:
    map_configs:
      map_frame: "map"
      base_frame: "base_link"
    a_star:
      planning_cost: 0.5
      # 障害物・インフレーション内にスタート/ゴールがある場合の最近傍通行可能セル探索半径 [m]
      snap_distance: 0.4
    smoothing:
      fillet:
        # RDP法でA*格子階段ノイズを除去する許容誤差 [m] (大きいほど大域的な角のみ抽出)
        rdp_epsilon: 0.05
        # 目標旋回半径 [m] (2.4 m/s で横G 4.5 m/s^2 以内を維持するための大弧: R >= 1.28 m)
        target_radius: 1.3
        # 狭所・障害物近傍での最小許容旋回半径 [m] (障害物が接近している場合に縮小を許容する限界)
        min_radius: 0.2
        # コーナー円弧が許容する最大セルコスト (0〜99: このコスト以下を通過するよう半径を自動調停)
        max_cost: 35
        # 出力経路のサンプリング解像度 [m]
        path_resolution: 0.05
        # 直線と円弧の接続部を滑らかにブレンドするイージング反復回数 (0: 無効, 1〜10: 推奨3)
        curvature_blend_iterations: 3
    footprint:
      # config/robot_shape_dimensioned.svg の青い8頂点外形。単位 m、反時計回り。
      # 原点: 元形状の幾何中心 (SVG: 819.90, 850.332381 mm)。+x 前方、+y 左。
      # 全長 0.98478 m、全幅 1.11981 m。C++既定値も robot_geometry.hpp に定義。
      polygon: [
        0.525332381, 0.209900000,
        -0.080887619, 0.559900000,
        -0.394447619, 0.350000000,
        -0.394447619, -0.350000000,
        -0.080887619, -0.559910000,
        0.525332381, -0.209910000,
        0.590332381, -0.080000000,
        0.590332381, 0.080000000
      ]
    rotation_planning:
      # 旋回区間全域で許容する最大フットプリントコスト (0~99: 通行可能, 100: 障害物)
      turn_max_cost: 20
      # 旋回干渉判定の角度ステップ [rad] (約5.7度)
      angle_step: 0.15
      # 旋回区間の移動距離 [m]
      turn_distance: 0.6
