costmap_generator_node:
  ros__parameters:
    # コストマップ配信周期 [Hz]
    publish_rate: 1.0
    resolution: 0.05
    map_bounds:
      min_x: -6.0
      max_x: 6.0
      min_y: -6.5
      max_y: 6.5
    # SVGは平面図のみ。高さは従来値を明示（実機高さは別途計測）。
    robot_clearance:
      z_min: 0.0
      z_max: 1.4
    inflation:
      # 壁際への接近用に不可侵半径を0.45 mへ縮小（全障害物共通）。
      # 外接半径約0.596 m未満。中心点の判定では姿勢によって機体の接触を許容。
      robot_radius: 0.45
      margin: 0.5
