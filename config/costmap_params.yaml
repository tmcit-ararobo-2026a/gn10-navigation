costmap_generator_node:
  ros__parameters:
    # マップソース形式 ("json" または "esdf")
    map_source_type: "json"
    # map_file_path: "config/nhk2026_map.json"  # 空欄ならデフォルト

    resolution: 0.05
    map_bounds:
      min_x: -6.0
      max_x: 6.0
      min_y: -6.5
      max_y: 6.5
    inflation:
      robot_radius: 0.35
      margin: 0.50
    costs:
      wall: 120
      partition: 200
      obstacle: 254
      default_cost: 254
