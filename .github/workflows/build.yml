name: CI
on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "feat/**", "fix/**" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ros2_build:
    name: ROS 2 Humble Build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: ros:humble-ros-base

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ros2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-ros2-${{ runner.os }}-

      - name: Build
        run: |
          set -e

          source /opt/ros/humble/setup.bash

          DEBIAN_FRONTEND=noninteractive apt-get update && apt-get install -y git ccache nlohmann-json3-dev

          export CCACHE_DIR=${{ github.workspace }}/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p $CCACHE_DIR
          ccache --max-size=500M

          rosdep update --rosdistro humble
          rosdep install --from-paths . --ignore-src -y --rosdistro humble

          colcon build \
            --cmake-args \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Test
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Check standard follower interface and idle rotation
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '219'
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          export ROS_LOG_DIR="$RUNNER_TEMP/follower-ros-logs"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import time

          from ament_index_python.packages import get_package_prefix
          from geometry_msgs.msg import TransformStamped, Twist
          import rclpy
          from std_msgs.msg import Bool
          from tf2_ros import TransformBroadcaster

          prefix = Path(get_package_prefix('gn10_navigation'))
          share = prefix / 'share/gn10_navigation'
          assert not (share / 'msg').exists()
          assert not (share / 'action').exists()
          rclpy.init()
          node = rclpy.create_node('standard_follower_smoke')
          transforms = TransformBroadcaster(node)
          velocities, indications = [], []
          node.create_subscription(Twist, '/robot/command/cmd_vel', velocities.append, 10)
          node.create_subscription(Bool, '/robot/command/can_move', indications.append, 10)
          with (Path(os.environ['RUNNER_TEMP']) / 'follower.log').open('w') as log:
              process = subprocess.Popen(
                  [str(prefix / 'lib/gn10_navigation/path_follower_node')],
                  stdout=log, stderr=log)
              try:
                  deadline = time.monotonic() + 10
                  while time.monotonic() < deadline:
                      assert process.poll() is None
                      batch = []
                      for frame, y in [('base_link', 0.0), ('bucket_bottom', 2.0)]:
                          transform = TransformStamped()
                          transform.header.frame_id = 'map'
                          transform.header.stamp = node.get_clock().now().to_msg()
                          transform.child_frame_id = frame
                          transform.transform.translation.y = y
                          transform.transform.rotation.w = 1.0
                          batch.append(transform)
                      transforms.sendTransform(batch)
                      rclpy.spin_once(node, timeout_sec=0.01)
                      if (velocities and indications and indications[-1].data
                              and velocities[-1].angular.z > 0):
                          assert velocities[-1].linear.x == velocities[-1].linear.y == 0
                          topics = dict(node.get_publisher_names_and_types_by_node(
                              'path_follower_node', '/'))
                          assert topics['/robot/command/cmd_vel'] == ['geometry_msgs/msg/Twist']
                          assert topics['/robot/command/can_move'] == ['std_msgs/msg/Bool']
                          print('Standard topics and idle bucket rotation confirmed')
                          break
                  else:
                      raise AssertionError('No idle rotation toward bucket TF')
              finally:
                  process.terminate()
                  process.wait(timeout=5)
                  node.destroy_node()
                  rclpy.shutdown()
          PY
